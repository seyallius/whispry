name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Tests that need FFmpeg fail instead of skipping.
  WHISPRY_TEST_STRICT: "1"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Check the build tools
        shell: bash
        run: cmake --version

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test the Rust crates
        run: cargo test --workspace

      - name: Test the packaging script
        run: python -m pytest -q scripts

  # End to end: speak a sentence, transcribe it with a real model, check the text.
  smoke:
    name: Transcribe on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Where Whispry keeps downloaded models; cached between runs.
      WHISPRY_MODEL_DIR: ${{ github.workspace }}/.whispry-models
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and a speech synthesizer (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke

      - name: Build
        run: cargo build --release --locked

      - name: Make a speech clip (Linux)
        if: runner.os == 'Linux'
        run: espeak-ng -w clip.wav "Hello world. This is a test of the transcription program."

      - name: Make a speech clip (macOS)
        if: runner.os == 'macOS'
        run: say -o clip.aiff "Hello world. This is a test of the transcription program."

      - name: Make a speech clip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile((Join-Path $PWD 'clip.wav'))
          $s.Speak('Hello world. This is a test of the transcription program.')
          $s.Dispose()

      - name: Restore the model cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.whispry-models
          key: whispry-model-small-v1

      - name: Transcribe
        shell: bash
        run: |
          if [ -f clip.wav ]; then clip=clip.wav; else clip=clip.aiff; fi
          start=$SECONDS
          ./target/release/whispry transcribe "$clip" --model small --device cpu --language en
          echo "Elapsed: $((SECONDS - start)) s"
          echo "--- clip.txt ---"
          cat clip.txt
          echo "----------------"
          if [ ! -s clip.txt ]; then
            echo "The transcript is empty" >&2
            exit 1
          fi
          if ! grep -qi "test" clip.txt; then
            echo "The transcript does not contain the word 'test'" >&2
            exit 1
          fi
