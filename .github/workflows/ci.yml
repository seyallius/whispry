name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Tests that need FFmpeg or Python fail instead of skipping.
  WHISPRY_TEST_STRICT: "1"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install numpy pytest

      - name: Tell the tests which Python to use
        shell: bash
        run: echo "WHISPRY_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test the Rust crates
        run: cargo test --workspace

      - name: Test the worker
        working-directory: worker
        run: python -m pytest -q
