[package]
name = "whispry-core"
description = "Transcription logic for Whispry. Never prints; reports progress through events."
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Build the GPU edition: CTranslate2 with CUDA, loading the CUDA libraries at
# run time. Needs the CUDA toolkit to build; not enabled by default.
cuda = ["ct2rs/cuda", "ct2rs/cuda-dynamic-loading"]

[dependencies]
ct2rs = { version = "0.10.4", default-features = false, features = ["whisper", "ruy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = "3.5.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { version = "0.10.4", default-features = false, features = ["whisper", "ruy", "accelerate"] }
