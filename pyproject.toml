[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispry"
dynamic = ["version"]
description = "Private, local speech-to-text transcription on CPU or NVIDIA GPU."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper==1.2.1",
    "numpy>=1.26,<3",
    "huggingface-hub>=0.30,<2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# CUDA 12 runtime libraries used by CTranslate2 on NVIDIA GPUs.
gpu = [
    "nvidia-cublas-cu12; platform_system != 'Darwin'",
    "nvidia-cudnn-cu12==9.*; platform_system != 'Darwin'",
]
dev = ["pytest>=8"]

[project.scripts]
whispry = "whispry.console:main"

[tool.setuptools.dynamic]
version = { attr = "whispry.__version__" }

[tool.setuptools.packages.find]
include = ["whispry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
