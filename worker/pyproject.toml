[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispry-worker"
version = "0.3.0"
description = "Speech-to-text worker process for Whispry"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2>=4.8.5,<5",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'win32'",
]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["whispry_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
